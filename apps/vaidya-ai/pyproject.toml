[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vedai"
version = "0.7.0"
description = "SARIT Ayurveda retrieval, reading room, and citation-checked OpenRouter answers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
rag = ["numpy>=1.26,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "indic-transliteration>=2.3,<3"]
test = ["httpx>=0.27,<1"]

[project.scripts]
vedai = "vedai.__main__:main"

[tool.setuptools.packages.find]
include = ["vedai*"]

[tool.setuptools.package-data]
vedai = ["static/*", "ayurveda_terms.json", "source_guides.json"]
