name: Vaidya AI tests

on:
  push:
    paths:
      - 'apps/vaidya-ai/**'
      - '.github/workflows/vaidya-ai-tests.yml'
  pull_request:
    paths:
      - 'apps/vaidya-ai/**'
      - '.github/workflows/vaidya-ai-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/vaidya-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[rag,test]"
      - run: python -m unittest discover -s tests -v
